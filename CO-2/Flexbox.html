<!DOCTYPE html>
<html>
  <head>
    <title>FLexbox</title>
    <style>
      h2{
        text-align: center;
      }
      body{
        font-family: tahoma;
        background-color: white;
      }
      .container{
        display:flex;
        flex-wrap: wrap;
        justify-content: center;
        gap:20px;
        padding:20px;
      }
      .cart{
        background-color:rgb(239, 209, 170);
        width:250px;
        padding:15px;
        border-radius:10px;
        box-shadow: 2px 2px 5px 0.5px;
        text-align: center;
      }
      .cart h3{
        margin:5px;
      }
      .btn{
        background-color: white;
        color:black;
        padding:15px 20px;
        border-radius:10px;
        border: 2px solid grey;
        cursor:pointer;
      }
    </style>
  </head>
  <body>
    <h2>Student Profiles</h2>
    <div class="container">
      <div class="cart">
        <h3>Geya</h3>
        <p>B-tech 1st Year</p>
        <p>CS-IT</p>
        <p>Attendance: 67%</p>
        <button class="btn">View</button>
      </div>
      <div class="cart">
        <h3>Priyanka</h3>
        <p>B-tech 1st Year</p>
        <p>CS-IT</p>
        <p>Attendance: 98%</p>
        <button class="btn">View</button>
      </div>
      <div class="cart">
        <h3>Moksha</h3>
        <p>B-tech 1st Year</p>
        <p>CSE</p>
        <p>Attendance: 86%</p>
        <button class="btn">View</button>
      </div>
    </div>
  </body>
</html>
